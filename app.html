<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>אפליקציית שיתוף כרטיסי ביקור דיגיטליים - קבוצת סופרין</title>

<!-- Meta description for previews -->

<!-- Open Graph (WhatsApp, Facebook, LinkedIn) -->
<meta property="og:title" content="אפליקציית שיתוף כרטיסי ביקור דיגיטליים - קבוצת סופרין">

<meta property="og:type" content="website">

<meta name="twitter:card" content="summary">

<meta name="twitter:description" content="כלי לעובדי קבוצת סופרין לשיתוף מהיר של כרטיס הביקור הדיגיטלי">

<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sufrin Cards">
<meta name="mobile-web-app-capable" content="yes">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg-page: #FAFAF7;
  --bg-card: #FFFFFF;
  --bg-soft: #F5F2EA;
  --bg-dark: #0A1628;
  --ink: #0A1628;
  --ink-light: #1E3A5F;
  --muted: #6B6555;
  --muted-light: #A8A193;
  --gold: #C9B885;
  --gold-soft: rgba(201, 184, 133, 0.1);
  --gold-border: rgba(201, 184, 133, 0.35);
  --line: rgba(10, 22, 40, 0.08);
  --line-strong: rgba(10, 22, 40, 0.15);
  --blue: #1F66B5;
  --blue-light: #5DADEC;
  --error: #DC2626;
  --error-soft: rgba(220, 38, 38, 0.1);
  --success: #16A34A;
  --shadow-sm: 0 2px 8px rgba(10, 22, 40, 0.06);
  --shadow-md: 0 6px 20px rgba(10, 22, 40, 0.08);
  --shadow-lg: 0 12px 40px rgba(10, 22, 40, 0.12);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg-page: #0A1628;
    --bg-card: #1A2942;
    --bg-soft: #243450;
    --ink: #F5F2EA;
    --ink-light: #C9B885;
    --muted: #A8A193;
    --muted-light: #7A7466;
    --line: rgba(245, 242, 234, 0.1);
    --line-strong: rgba(245, 242, 234, 0.2);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 6px 20px rgba(0, 0, 0, 0.4);
  }
}

html, body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: var(--bg-page);
  color: var(--ink);
  overscroll-behavior-y: contain;
  -webkit-font-smoothing: antialiased;
  height: 100%;
  overflow-x: hidden;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

.app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ============== LOADING ============== */
.loading {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 40px;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid var(--gold-border);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  color: var(--muted);
  font-size: 14px;
}

.hidden { display: none !important; }

/* ============== LOGIN SCREEN ============== */
.login-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  padding: 40px 24px;
  justify-content: center;
}

.login-logo {
  text-align: center;
  margin-bottom: 40px;
}

.login-logo-img {
  max-width: 240px;
  max-height: 80px;
  width: auto;
  height: auto;
  margin-bottom: 20px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.login-logo-img-fallback {
  width: 80px;
  height: 80px;
  border-radius: 22px;
  box-shadow: var(--shadow-md);
  margin-bottom: 20px;
  display: block;
  margin-left: auto;
  margin-right: auto;
}

.login-title {
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 8px;
  text-align: center;
  line-height: 1.4;
}

.login-subtitle {
  color: var(--muted);
  font-size: 14px;
  text-align: center;
  margin-bottom: 4px;
  font-weight: 500;
}

.login-tagline {
  text-align: center;
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 2px;
  font-weight: 500;
  margin-top: 4px;
}

.login-form {
  background: var(--bg-card);
  padding: 28px 24px;
  border-radius: 20px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
  margin-top: 32px;
}

.form-group {
  margin-bottom: 16px;
}

.form-label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 500;
}

.form-input {
  width: 100%;
  padding: 14px 16px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 15px;
  color: var(--ink);
  font-family: inherit;
  transition: all 0.2s ease;
}

.form-input:focus {
  outline: none;
  border-color: var(--gold);
  background: var(--bg-card);
}

.btn-primary {
  width: 100%;
  padding: 16px;
  background: var(--ink);
  color: var(--bg-card);
  border: none;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: inherit;
  margin-top: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.btn-primary:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
.btn-primary:active { transform: translateY(0); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

.error-msg {
  background: var(--error-soft);
  border: 1px solid var(--error);
  color: var(--error);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 13px;
  margin-bottom: 14px;
  text-align: center;
}

/* ============== MAIN APP SCREEN ============== */
.main-screen {
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* Header */
.app-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 4px;
}

.user-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--gold), var(--ink-light));
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 600;
  color: var(--bg-card);
  overflow: hidden;
  flex-shrink: 0;
  border: 2px solid var(--bg-card);
  box-shadow: var(--shadow-sm);
}

.user-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.user-info {
  flex: 1;
  min-width: 0;
}

.user-greeting {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 2px;
}

.user-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.logout-btn {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
}

.logout-btn:hover {
  border-color: var(--error);
  color: var(--error);
}

/* QR Code Section */
.qr-section {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 24px 20px 20px;
  text-align: center;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}

.qr-section-title {
  font-size: 12px;
  letter-spacing: 1.5px;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 14px;
}

.qr-wrap {
  background: white;
  padding: 16px;
  border-radius: 14px;
  display: inline-block;
  margin-bottom: 14px;
  border: 1px solid var(--line);
}

#qrcode {
  display: inline-block;
  width: 200px;
  height: 200px;
}

#qrcode img {
  display: block;
  margin: 0 auto;
}

#qrcode canvas {
  display: block;
  margin: 0 auto;
}

.qr-url {
  font-size: 11px;
  color: var(--muted);
  font-family: 'Courier New', monospace;
  letter-spacing: 0.2px;
  direction: ltr;
  word-break: break-all;
  margin-top: 4px;
}

/* Share Buttons */
.share-section {
  background: var(--bg-card);
  border-radius: 20px;
  padding: 18px 16px;
  border: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}

.share-section-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.share-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.share-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 10px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 14px;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
  font-family: inherit;
  min-height: 56px;
}

.share-btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.share-btn:active {
  transform: translateY(0);
}

.share-btn-whatsapp:hover {
  background: rgba(37, 211, 102, 0.08);
  border-color: rgba(37, 211, 102, 0.3);
}

.share-btn-email:hover {
  background: rgba(31, 102, 181, 0.08);
  border-color: rgba(31, 102, 181, 0.3);
}

.share-btn-nfc:hover {
  background: rgba(168, 85, 247, 0.08);
  border-color: rgba(168, 85, 247, 0.3);
}

.share-btn-system:hover {
  background: var(--gold-soft);
  border-color: var(--gold-border);
}

.share-btn svg {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
}

/* Native share button - full width */
.share-btn-native {
  grid-column: 1 / -1;
  background: var(--ink);
  color: var(--bg-card);
  border-color: var(--ink);
  font-weight: 600;
}

.share-btn-native:hover {
  background: var(--ink-light);
  border-color: var(--ink-light);
}

.share-btn-native svg {
  color: var(--bg-card);
}

/* Footer Actions */
.footer-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 0 4px;
  margin-top: 4px;
}

.footer-action {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 12px;
  font-size: 14px;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.15s ease;
  text-decoration: none;
}

.footer-action:hover {
  background: var(--bg-card);
  border-color: var(--line-strong);
  color: var(--ink);
}

.footer-action svg {
  width: 16px;
  height: 16px;
}

/* Toast */
.toast {
  position: fixed;
  bottom: calc(20px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: var(--bg-card);
  padding: 12px 24px;
  border-radius: 100px;
  font-size: 14px;
  font-weight: 500;
  z-index: 1000;
  opacity: 0;
  transition: all 0.3s ease;
  box-shadow: var(--shadow-lg);
  max-width: calc(100% - 40px);
  text-align: center;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.success { background: var(--success); }
.toast.error { background: var(--error); }

/* Install prompt banner */
.install-banner {
  background: linear-gradient(135deg, var(--gold-soft), rgba(201, 184, 133, 0.05));
  border: 1px solid var(--gold-border);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 4px;
  position: relative;
}

.install-banner-icon {
  font-size: 24px;
  flex-shrink: 0;
}

.install-banner-text {
  flex: 1;
  font-size: 13px;
  color: var(--ink);
  line-height: 1.4;
}

.install-banner-text strong {
  display: block;
  font-weight: 600;
  margin-bottom: 2px;
}

.install-banner-close {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 8px;
  flex-shrink: 0;
}

/* Instructions Modal */
.instructions-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 22, 40, 0.6);
  backdrop-filter: blur(8px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 200;
  animation: fadeIn 0.2s ease;
}

@media (min-width: 480px) {
  .instructions-overlay {
    align-items: center;
    padding: 20px;
  }
}

.instructions-modal {
  background: var(--bg-card);
  width: 100%;
  max-width: 480px;
  max-height: 85vh;
  border-radius: 24px 24px 0 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  animation: slideUp 0.3s ease;
}

@media (min-width: 480px) {
  .instructions-modal {
    border-radius: 24px;
    max-height: 80vh;
  }
}

.instructions-header {
  padding: 20px 24px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  flex-shrink: 0;
}

.instructions-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--ink);
}

.instructions-close {
  background: var(--bg-soft);
  border: none;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  font-size: 20px;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.instructions-content {
  padding: 20px 24px 24px;
  overflow-y: auto;
  flex: 1;
}

.instr-platform-tabs {
  display: flex;
  gap: 8px;
  background: var(--bg-soft);
  border-radius: 12px;
  padding: 4px;
  margin-bottom: 20px;
}

.instr-platform-tab {
  flex: 1;
  padding: 10px 14px;
  background: transparent;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s ease;
}

.instr-platform-tab.active {
  background: var(--bg-card);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
}

.instr-step {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  margin-bottom: 18px;
}

.instr-step-num {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--gold-soft);
  color: var(--gold);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 14px;
  border: 1.5px solid var(--gold-border);
}

.instr-step-text {
  flex: 1;
  font-size: 14px;
  line-height: 1.5;
  color: var(--ink);
  padding-top: 5px;
}

.instr-step-text strong {
  font-weight: 600;
}

.instr-icon-inline {
  display: inline-flex;
  vertical-align: middle;
  width: 20px;
  height: 20px;
  margin: 0 2px;
}

.instr-tip {
  background: var(--gold-soft);
  border: 1px solid var(--gold-border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  color: var(--ink);
  margin-top: 16px;
  display: flex;
  gap: 10px;
}

.instr-tip-icon {
  font-size: 18px;
  flex-shrink: 0;
}

@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}

/* Footer Tag */
.app-footer-tag {
  text-align: center;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--muted-light);
  padding: 16px 0 8px;
  font-weight: 500;
}

</style>
</head>
<body>

<div class="app" id="app">

  <!-- Loading State -->
  <div class="loading" id="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">טוען...</div>
  </div>

  <!-- Login Screen -->
  <div class="login-screen hidden" id="login-screen">
    <div class="login-logo">
      <img src="" class="login-logo-img" alt="Sufrin Group" id="login-logo-img" style="display:none;">
      <img src="/icon-192.png" class="login-logo-img-fallback" alt="Sufrin" id="login-logo-fallback">
      <div class="login-title">אפליקציית שיתוף<br>כרטיסי ביקור דיגיטליים</div>
      <div class="login-subtitle">קבוצת סופרין</div>
    </div>
    
    <div class="login-form">
      <div class="error-msg hidden" id="login-error"></div>
      
      <div class="form-group">
        <label class="form-label" for="login-email">אימייל</label>
        <input type="email" id="login-email" class="form-input" autocomplete="email" autocapitalize="none" autocorrect="off" required>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="login-password">סיסמה</label>
        <input type="password" id="login-password" class="form-input" autocomplete="current-password" required>
      </div>
      
      <button type="button" class="btn-primary" id="login-btn" onclick="doLogin()">
        <span id="login-btn-text">התחבר</span>
      </button>
    </div>
  </div>

  <!-- Main App Screen -->
  <div class="main-screen hidden" id="main-screen">
    
    <!-- Install Banner - Always visible if not installed -->
    <div class="install-banner hidden" id="install-banner">
      <div class="install-banner-icon">📱</div>
      <div class="install-banner-text">
        <strong>הוסף למסך הבית</strong>
        גישה מהירה בלחיצה אחת
      </div>
      <button class="install-banner-close" id="install-close" onclick="hideInstallBanner()" type="button">×</button>
    </div>
    
    <!-- Install Instructions Modal -->
    <div class="instructions-overlay hidden" id="instructions-overlay" onclick="closeInstructions(event)">
      <div class="instructions-modal" onclick="event.stopPropagation()">
        <div class="instructions-header">
          <div class="instructions-title" id="instructions-title">איך להוסיף למסך הבית</div>
          <button class="instructions-close" onclick="closeInstructions()" type="button">×</button>
        </div>
        <div class="instructions-content" id="instructions-content">
          <!-- Filled by JS based on platform -->
        </div>
      </div>
    </div>
    
    <!-- Header -->
    <div class="app-header">
      <div class="user-avatar" id="user-avatar">
        <span id="user-initial">?</span>
      </div>
      <div class="user-info">
        <div class="user-greeting">שלום</div>
        <div class="user-name" id="user-name">טוען...</div>
      </div>
      <button class="logout-btn" onclick="doLogout()">התנתק</button>
    </div>

    <!-- QR Code Section -->
    <div class="qr-section">
      <div class="qr-section-title">סרוק לקבלת הכרטיס</div>
      <div class="qr-wrap">
        <div id="qrcode"></div>
      </div>
      <div class="qr-url" id="qr-url">card.sufrin.io/?u=...</div>
    </div>

    <!-- Share Section -->
    <div class="share-section">
      <div class="share-section-title">

});

});

}

    if (sessionError) {
      console.error('[App] Session error:', sessionError);
    }
    
    // If no session but we have a refresh token, try to refresh
    if (!session) {
      console.log('[App] No session, trying refresh...');
      try {
        const { data: refreshData } = await supabase.auth.refreshSession();
        if (refreshData?.session) {
          session = refreshData.session;
          console.log('[App] Session refreshed successfully');
        }
      } catch (refreshErr) {
        console.log('[App] Refresh failed (this is normal if not logged in):', refreshErr);
      }

    if (session) {
      console.log('[App] Session found, loading user data');
      await loadUserData(session.user);
    } else {
      console.log('[App] No session, showing login');
      showLoginScreen();
    }
    
    // Listen for auth state changes (login/logout/token refresh)
    supabase.auth.onAuthStateChange((event, session) => {
      console.log('[App] Auth event:', event);
      
      if (event === 'SIGNED_OUT') {
        currentUser = null;
        currentEmployee = null;
        showLoginScreen();
      } else if (event === 'TOKEN_REFRESHED') {
        console.log('[App] Token refreshed automatically');
      }
    });
    
    // Register service worker with auto-update support
    if ('serviceWorker' in navigator) {
      try {
        const registration = await navigator.serviceWorker.register('/service-worker.js');
        console.log('[App] SW registered');
        
        // Check for updates every 60 seconds when app is open
        setInterval(() => {
          registration.update().catch(() => {});
        }, 60000);
        
        // Listen for new SW waiting
        registration.addEventListener('updatefound', () => {
          const newWorker = registration.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // New version available - show update banner
                showUpdateAvailable();
              }
            });
          }
        });
        
        // Listen for messages from SW
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data?.type === 'SW_UPDATED') {
            console.log('[App] SW updated to version', event.data.version);
          }
        });
        
        // Reload page when new SW takes control
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          refreshing = true;
          window.location.reload();
        });
      } catch (err) {
        console.log('[App] SW registration failed (non-critical):', err);
      }
    }
    
    // Listen for install prompt (Android Chrome)
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });
    
    // Show install banner after a delay (unless already dismissed/installed)
    setTimeout(() => {
      showInstallBannerIfNeeded();
    }, 1500);
  } catch (err) {
    console.error('Init error:', err);
    showErrorOnLoadingScreen('שגיאה באתחול: ' + err.message);
  }
}

function isStandalone() {
  // Check if app is running as installed PWA
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone === true ||
         document.referrer.includes('android-app://');
}

function getPlatform() {
  const ua = navigator.userAgent;
  if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
  if (/Android/i.test(ua)) return 'android';
  return 'other';
}

function showInstallBannerIfNeeded() {
  // Don't show if already installed, dismissed, or not on main screen
  if (isStandalone()) return;
  if (localStorage.getItem('install-dismissed')) return;
  
  const banner = document.getElementById('install-banner');
  if (!banner) return;
  
  // Show banner and make it open instructions on tap
  banner.classList.remove('hidden');
  banner.style.cursor = 'pointer';
  banner.onclick = (ev) => {
    if (ev.target.classList.contains('install-banner-close')) return;
    showInstructions();
  };
}

function showInstructions() {

    <div id="instr-platform-content"></div>

  content.innerHTML = html;
  switchPlatform(platform === 'other' ? 'ios' : platform);
  overlay.classList.remove('hidden');
}

        <div class="instr-step-num">3</div>

        margin-top: 16px;
        cursor: pointer;
        font-family: inherit;
      ">
        📱 התקן עכשיו (לחיצה אחת)
      </button>
      ` : ''}
      <div class="instr-tip">
        <span class="instr-tip-icon">💡</span>
        <div>בפעם הבאה - פתח את האייקון מהמסך הראשי. האפליקציה תיפתח במסך מלא, בלי דפדפן.</div>

function closeInstructions(event) {

    return;

  document.getElementById('instructions-overlay').classList.add('hidden');
}

function showLoginScreen() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

// Load company logo for login screen (no auth needed - public read)
async function loadCompanyLogo() {
  try {
    const { data, error } = await supabase
      .from('company_settings')
      .select('logo_url')
      .single();
    
    if (data?.logo_url) {
      const logoImg = document.getElementById('login-logo-img');
      const fallback = document.getElementById('login-logo-fallback');

      const testImg = new Image();

    console.log('[App] Could not load company logo:', err);

function showMainScreen() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.remove('hidden');
}

function showLoading() {
  document.getElementById('loading-screen').classList.remove('hidden');
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('main-screen').classList.add('hidden');
}

// ============================================
// AUTH
// ============================================
async function doLogin() {
  console.log('[Login] Started');
  
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errorEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');
  const btnText = document.getElementById('login-btn-text');
  
  errorEl.classList.add('hidden');
  
  if (!email || !password) {
    errorEl.textContent = 'נא להזין אימייל וסיסמה';
    errorEl.classList.remove('hidden');
    return;
  }
  
  console.log('[Login] Attempting with email:', email);
  
  btn.disabled = true;
  btnText.textContent = 'מתחבר...';
  
  try {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    
    console.log('[Login] Response:', { hasData: !!data, hasError: !!error });
    
    if (error) {
      console.error('[Login] Auth error:', error);
      throw error;
    }
    
    console.log('[Login] Success, loading user data');
    await loadUserData(data.user);
  } catch (err) {
    console.error('[Login] Caught error:', err);
    errorEl.textContent = err.message?.includes('Invalid login') 
      ? 'אימייל או סיסמה שגויים' 
      : `שגיאה: ${err.message || 'לא ידוע'}`;
    errorEl.classList.remove('hidden');
    btn.disabled = false;
    btnText.textContent = 'התחבר';
  }
}

// Enter key submits login form
document.addEventListener('DOMContentLoaded', () => {
  const passwordInput = document.getElementById('login-password');
  const emailInput = document.getElementById('login-email');
  
  if (passwordInput) {
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doLogin();
    });
  }
  if (emailInput) {
    emailInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        passwordInput?.focus();
      }
    });
  }
});

async function doLogout() {
  if (!confirm('להתנתק מהאפליקציה?')) return;
  
  showLoading();
  await supabase.auth.signOut();
  currentUser = null;
  currentEmployee = null;
  
  // Clear inputs
  document.getElementById('login-email').value = '';
  document.getElementById('login-password').value = '';
  
  showLoginScreen();
}

async function loadUserData(user) {
  showLoading();
  currentUser = user;
  
  try {
    // Find employee by email (case-insensitive match)
    // Use ilike for case-insensitive comparison
    const userEmail = (user.email || '').toLowerCase().trim();
    
    const { data: employee, error } = await supabase
      .from('employees')
      .select('*')
      .ilike('email', userEmail)
      .eq('is_active', true)
      .maybeSingle();
    
    if (error || !employee) {
      // No employee record found - check if admin user
      const { data: adminData } = await supabase
        .from('admin_users')
        .select('*')
        .eq('user_id', user.id)
        .single();
      
      if (adminData) {
        // Admin without employee record - show error
        showLoginScreen();
        const errorEl = document.getElementById('login-error');
        errorEl.textContent = 'אין כרטיס ביקור משויך לאימייל שלך. פנה למנהל המערכת.';
        errorEl.classList.remove('hidden');
        await supabase.auth.signOut();
        return;
      }
      
      // Not authorized at all
      showLoginScreen();
      const errorEl = document.getElementById('login-error');
      errorEl.textContent = 'אין לך הרשאת גישה לאפליקציה. פנה למנהל המערכת.';
      errorEl.classList.remove('hidden');
      await supabase.auth.signOut();
      return;
    }
    
    currentEmployee = employee;
    renderUserData();
    showMainScreen();
  } catch (err) {
    console.error('Error loading user:', err);
    showLoginScreen();
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = 'שגיאה בטעינת הנתונים. נסה שוב.';
    errorEl.classList.remove('hidden');
  }
}

function renderUserData() {
  const emp = currentEmployee;
  const cardUrl = `${CARD_BASE_URL}/?u=${encodeURIComponent(emp.username)}`;
  
  // User name
  document.getElementById('user-name').textContent = emp.full_name;
  
  // Avatar
  const avatar = document.getElementById('user-avatar');
  if (emp.photo_url) {
    avatar.innerHTML = `<img src="${escapeHtml(emp.photo_url)}" alt="">`;
  } else {
    avatar.innerHTML = `<span>${escapeHtml(emp.full_name.charAt(0))}</span>`;
  }
  
  // QR Code
  generateQR(cardUrl);
  
  // URL display
  document.getElementById('qr-url').textContent = cardUrl.replace('https://', '');
  
  // View card link
  document.getElementById('view-card-link').href = cardUrl;
  
  // Hide native share button if not supported
  if (!navigator.share) {
    document.getElementById('share-native-btn').style.display = 'none';
  }
}

function generateQR(url) {
  const container = document.getElementById('qrcode');
  if (!container || !window.QRCode) return;
  
  // Clear previous
  container.innerHTML = '';
  
  // qrcodejs needs a div, not canvas
  // Replace canvas with div if needed
  if (container.tagName === 'CANVAS') {
    const div = document.createElement('div');
    div.id = 'qrcode';
    container.parentNode.replaceChild(div, container);
  }
  
  // Create QR Code
  try {
    new QRCode(document.getElementById('qrcode'), {
      text: url,
      width: 200,
      height: 200,
      colorDark: '#0A1628',
      colorLight: '#FFFFFF',
      correctLevel: QRCode.CorrectLevel.M
    });
  } catch (err) {
    console.error('QR error:', err);
  }
}

// ============================================
// SHARE FUNCTIONS
// ============================================
function getCardUrl() {
  return `${CARD_BASE_URL}/?u=${encodeURIComponent(currentEmployee.username)}`;
}

function getShareText() {
  return `${currentEmployee.full_name} - ${currentEmployee.title}`;
}

function getShareMessage() {
  return `${getShareText()}\n${getCardUrl()}`;
}

async function shareNative() {
  if (!navigator.share) {
    showToast('שיתוף זה לא נתמך במכשיר שלך', 'error');
    return;
  }
  
  try {
    await navigator.share({
      title: `כרטיס ביקור - ${currentEmployee.full_name}`,
      text: getShareText(),
      url: getCardUrl()
    });
  } catch (err) {
    if (err.name !== 'AbortError') {
      console.error('Share error:', err);
    }
  }
}

function shareWhatsApp() {
  const url = `https://wa.me/?text=${encodeURIComponent(getShareMessage())}`;
  window.open(url, '_blank');
}

function shareEmail() {
  const subject = `כרטיס ביקור דיגיטלי - ${currentEmployee.full_name}`;
  const body = `שלום,\n\nמצורף קישור לכרטיס הביקור הדיגיטלי שלי:\n${getCardUrl()}\n\nתודה!`;
  window.location.href = `mailto:?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}

function shareSMS() {
  // SMS link (works on mobile)
  const text = encodeURIComponent(getShareMessage());
  // iOS uses ?body=, Android uses ?body= too (newer Android)
  window.location.href = `sms:?&body=${text}`;
}

async function copyLink() {
  const url = getCardUrl();
  try {
    await navigator.clipboard.writeText(url);
    showToast('הקישור הועתק!', 'success');
  } catch (err) {
    // Fallback
    const textarea = document.createElement('textarea');
    textarea.value = url;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      showToast('הקישור הועתק!', 'success');
    } catch (e) {
      showToast('שגיאה בהעתקה', 'error');
    }
    document.body.removeChild(textarea);
  }
}

// ============================================
// PWA INSTALL
// ============================================
async function promptInstall() {
  if (!deferredPrompt) {
    showToast('פתח את ההוראות לקבלת הסבר', 'info');
    return;
  }
  
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  
  if (outcome === 'accepted') {
    showToast('האפליקציה הותקנה!', 'success');
    closeInstructions({target: {id: 'instructions-overlay'}});
    hideInstallBanner();
  }
  
  deferredPrompt = null;
}

function hideInstallBanner() {
  document.getElementById('install-banner').classList.add('hidden');
  localStorage.setItem('install-dismissed', '1');
}

// ============================================
// UPDATE NOTIFICATION
// ============================================
function showUpdateAvailable() {
  // Check if banner already shown
  if (document.getElementById('update-banner')) return;
  
  const banner = document.createElement('div');
  banner.id = 'update-banner';
  banner.style.cssText = `
    position: fixed;
    bottom: calc(20px + env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--bg-card);
    padding: 14px 20px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 500;
    z-index: 1000;
    box-shadow: var(--shadow-lg);
    max-width: calc(100% - 40px);
    display: flex;
    align-items: center;
    gap: 12px;
    animation: slideUp 0.3s ease;
  `;
  banner.innerHTML = `
    <span style="font-size:18px;">🔄</span>
    <span style="flex:1;">גרסה חדשה זמינה</span>
    <button onclick="applyUpdate()" style="
      background: var(--gold);
      color: var(--ink);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    ">עדכן</button>
  `;
  document.body.appendChild(banner);
}

async function applyUpdate() {
  if ('serviceWorker' in navigator) {
    const registration = await navigator.serviceWorker.getRegistration();
    if (registration?.waiting) {
      registration.waiting.postMessage({ type: 'SKIP_WAITING' });
    } else {
      // No waiting SW - just reload
      window.location.reload();
    }
  } else {
    window.location.reload();
  }
}

// ============================================
// UTILITIES
// ============================================
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

function showToast(message, type = '') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `toast ${type} show`;
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

// Start
init();

} // End of library check else block
